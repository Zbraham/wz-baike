<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王者百科 · 王者荣耀英雄攻略教学网站</title>
  <meta name="description" content="王者荣耀 S36 赛季英雄百科、装备百科、英雄梯度、克制查询，纯前端离线教学网站。">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <!-- 主题：样式前应用已保存的主题，避免刷新闪变 -->
  <script>try{var t=localStorage.getItem('wqk-theme')||'system';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 全局导航（components.js 渲染） -->
  <div id="navbar"></div>

  <main class="container" style="padding-top:26px">

    <!-- ① 赛季简介板块 -->
    <section id="season-hero" class="animate-in"></section>

    <!-- ② 全位置英雄快速分类入口 -->
    <div class="sec-head">
      <div>
        <h2 class="text-section">全位置快速入口</h2>
        <div class="sub">选择位置，直达对应英雄百科</div>
      </div>
    </div>
    <section id="pos-grid" class="grid g-5 gap-4"></section>

    <!-- ③ 本周强势英雄推荐 -->
    <div class="sec-head">
      <div>
        <h2 class="text-section">本周强势英雄</h2>
        <div class="sub">依据胜率 · 出场率 · 版本梯度综合评定</div>
      </div>
      <a href="pages/hero.html" class="btn btn-ghost btn-sm">查看全部英雄 →</a>
    </div>
    <section id="strong-grid" class="grid g-4 gap-4"></section>

    <!-- ④ 网站功能简介 -->
    <div class="sec-head">
      <div>
        <h2 class="text-section">功能简介</h2>
        <div class="sub">一站式英雄学习，从入门到上分</div>
      </div>
    </div>
    <section id="intro-grid" class="grid g-4 gap-4"></section>

    <!-- ⑤ 版本数据图表 -->
    <div class="sec-head">
      <div>
        <h2 class="text-section">版本英雄胜率概览</h2>
        <div class="sub">数据基于当前赛季模拟，仅作参考</div>
      </div>
    </div>
    <section class="card card-pad">
      <div id="meta-chart" style="width:100%;height:300px"></div>
    </section>

  </main>

  <!-- 页脚 -->
  <div id="footer"></div>

  <!-- 共享脚本 -->
  <script>
    window.PAGE = 'home';
    window.BASE_PATH = '';
  </script>
  <!-- 离线数据层（json 数据以 .js 注入，保证 file:// 直跑可用） -->
  <script src="json/heroes.js"></script>
  <script src="json/items.js"></script>
  <script src="json/details.js"></script>
  <script src="json/tiers.js"></script>
  <script src="json/season.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/search.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/lib/echarts.min.js"></script>
  <script src="js/home.js"></script>

</body>
</html>
